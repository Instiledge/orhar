<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy — ORHAR</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #FCFBF8;
            --surface-color: #FFFFFF;
            --primary-navy: #1A2E4A;
            --header-bg: #FCFBF8;
            --accent-gold: #CFB286;
            --accent-brown: #915B27;
            --text-dark: #1e1e1e;
            --text-muted: #4a4a4a;
            
            --font-display: 'Cormorant Garamond', serif;
            --font-body: 'Work Sans', sans-serif;
            --theme-transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); background-color: var(--bg-color); color: var(--text-dark); line-height: 1.7; transition: var(--theme-transition); }
        h1, h2, h3, h4 { font-family: var(--font-display); color: var(--primary-navy); transition: var(--theme-transition); }
        a { text-decoration: none; color: var(--primary-navy); transition: var(--theme-transition); font-weight: 500; }
        a:hover { color: var(--accent-brown); }

        /* Header & Nav */
        header { padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; background: var(--header-bg); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--accent-gold); transition: var(--theme-transition); }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
        .logo-text { font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: 2px; color: var(--primary-navy); }
        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-links a { font-size: 15px; font-weight: 500; }
        
        /* Language Switcher */
        .lang-select { background: transparent; border: 1px solid var(--accent-gold); color: var(--primary-navy); padding: 5px 10px; border-radius: 6px; font-family: var(--font-body); font-weight: 500; cursor: pointer; outline: none; }
        .lang-select:hover { border-color: var(--accent-brown); }

        /* Legal Content Container */
        .legal-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 40px;
            background: var(--surface-color);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(26, 46, 74, 0.05);
            border-top: 4px solid var(--accent-gold);
        }

        .legal-container h1 { font-size: 42px; margin-bottom: 10px; border-bottom: 1px solid rgba(207, 178, 134, 0.3); padding-bottom: 20px; }
        .legal-container h2 { font-size: 28px; margin-top: 40px; margin-bottom: 15px; color: var(--accent-brown); }
        .legal-container h3 { font-size: 20px; margin-top: 25px; margin-bottom: 10px; }
        .legal-container p { font-size: 16px; color: var(--text-muted); margin-bottom: 15px; }
        .legal-container ul { margin-left: 20px; margin-bottom: 20px; color: var(--text-muted); }
        .legal-container li { margin-bottom: 10px; }
        .legal-container strong { color: var(--text-dark); }
        
        .highlight-box {
            background-color: rgba(207, 178, 134, 0.1);
            border-left: 4px solid var(--accent-brown);
            padding: 20px;
            margin: 30px 0;
            border-radius: 0 8px 8px 0;
        }
        .highlight-box h2 { margin-top: 0; }
        
        .support-email {
            font-weight: 600;
            color: var(--accent-brown);
            padding: 4px 8px;
            background: rgba(145, 91, 39, 0.1);
            border-radius: 4px;
        }

        /* Footer */
        footer { background-color: var(--surface-color); padding: 40px 5% 30px; border-top: 1px solid var(--accent-gold); transition: var(--theme-transition); }
        .footer-content { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 30px; }
        .footer-brand h2 { font-size: 28px; letter-spacing: 3px; margin-bottom: 5px; }
        .footer-links { display: flex; gap: 20px; }
        .footer-links a { font-size: 14px; color: var(--text-muted); }
        .copyright { text-align: center; margin-top: 30px; font-size: 13px; color: var(--text-muted); opacity: 0.8; }

        @media (max-width: 768px) {
            .nav-links { flex-wrap: wrap; justify-content: center; margin-top: 15px; }
            header { flex-direction: column; }
            .legal-container { margin: 30px 5%; padding: 25px; }
            .legal-container h1 { font-size: 32px; }
            .footer-content { flex-direction: column; text-align: center; }
        }
    </style>
</head>

        function changeLang(lang) {
            // Update UI elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (uiTranslations[lang] && uiTranslations[lang][key]) {
                    el.innerHTML = uiTranslations[lang][key];
                }
            });

            // Update Policy Content
            document.getElementById('policy-content').innerHTML = policies[lang];
            
            // Save preference
            localStorage.setItem('orhar_lang', lang);
            document.documentElement.lang = lang;
        }

        // Auto-detect and initialize
        document.addEventListener("DOMContentLoaded", () => {
            const savedLang = localStorage.getItem('orhar_lang');
            const browserLang = navigator.language.slice(0, 2);
            const supported = ['en', 'fr', 'es', 'de', 'it', 'pt', 'pl'];
            
            let initLang = 'en';
            if (savedLang && supported.includes(savedLang)) {
                initLang = savedLang;
            } else if (supported.includes(browserLang)) {
                initLang = browserLang;
            }
            
            document.getElementById('langSwitch').value = initLang;
            changeLang(initLang);
        });
    </script>
</body>
</html>
