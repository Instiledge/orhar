<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>ORHAR — News & updates</title>
  <meta name="description" content="Follow the latest ORHAR news in your language.">
  <meta name="theme-color" content="#0b182a">
  <link rel="stylesheet" href="/site.css?v=23">
  <script>
    const supported = ['en','fr','es','de','it','pt','pl'];
    const saved = localStorage.getItem('orhar_lang') || navigator.language.slice(0,2);
    location.replace(`/${supported.includes(saved) ? saved : 'en'}/actuality.html`);
  </script>
</head>
<body>
  <main class="news-hero" id="main">
    <div class="section-inner">
      <p class="eyebrow">ORHAR · NEWS</p>
      <h1>What’s new in ORHAR</h1>
      <p>Choose your language to read the latest news.</p>
      <nav class="hero-actions" aria-label="Choose language">
        <a class="button button-primary" href="/en/actuality.html">🇬🇧 English</a>
        <a class="button button-secondary" href="/fr/actuality.html">🇫🇷 Français</a>
        <a class="button button-secondary" href="/es/actuality.html">🇪🇸 Español</a>
        <a class="button button-secondary" href="/de/actuality.html">🇩🇪 Deutsch</a>
        <a class="button button-secondary" href="/it/actuality.html">🇮🇹 Italiano</a>
        <a class="button button-secondary" href="/pt/actuality.html">🇵🇹 Português</a>
        <a class="button button-secondary" href="/pl/actuality.html">🇵🇱 Polski</a>
      </nav>
    </div>
  </main>
</body>
</html>
