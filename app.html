<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download ORHAR App</title>
    
    <!-- ========== FONT AWESOME (needed for footer icons) ========== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ========== GOOGLE FONTS ========== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- ========== FAVICONS ========== -->
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <!-- ========== PRIMARY META TAGS ========== -->
    <meta name="description" content="Download ORHAR — The Mountain of Light. A multilingual Bible app for the daily ascent through Scripture.">
    <meta name="theme-color" content="#1A2E4A">
    <link rel="canonical" href="https://orhar.com/app.html">
    
    <style>
        :root {
            --primary-navy: #1A2E4A;
            --accent-gold: #CFB286;
            --accent-gold-rgb: 207, 178, 134;
            --accent-brown: #915B27;
            --bg-color: #FCFBF8;
            --theme-transition: background-color 0.5s ease, color 0.5s ease;
            --font-display: 'Cormorant Garamond', Georgia, serif;
            --font-body: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-body);
            background: var(--bg-color);
            color: #1e1e1e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }
        
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }
        
        .container {
            max-width: 500px;
            text-align: center;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(207, 178, 134, 0.3);
        }
        
        h1 {
            font-family: var(--font-display);
            font-size: 36px;
            color: var(--primary-navy);
            margin-bottom: 12px;
        }
        
        p {
            font-size: 16px;
            color: #7f8c8d;
            line-height: 1.7;
            margin-bottom: 24px;
        }
        
        .badge {
            display: inline-block;
            background: rgba(207, 178, 134, 0.15);
            border: 1px solid var(--accent-gold);
            color: var(--accent-brown);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        .home-link {
            display: inline-block;
            margin-top: 24px;
            color: var(--accent-brown);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
        }
        
        .home-link:hover {
            text-decoration: underline;
        }

        /* ========== FOOTER ========== */
        footer { 
            background: linear-gradient(180deg, var(--primary-navy), #0f1f33); 
            padding: 70px 5% 35px; 
            border-top: 1px solid rgba(var(--accent-gold-rgb), 0.3); 
            transition: var(--theme-transition);
            color: #FFFFFF;
        }

        #footer-container footer {
            animation: footerFadeIn 0.3s ease;
        }
        
        @keyframes footerFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .footer-content { 
            max-width: 1200px; 
            margin: 0 auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            flex-wrap: wrap; 
            gap: 40px; 
        }
        
        .footer-brand h2 { 
            font-size: 34px; 
            letter-spacing: 4px; 
            margin-bottom: 8px;
            color: var(--accent-gold);
            font-family: var(--font-display);
        }
        
        .footer-brand p { 
            font-style: italic; 
            color: rgba(255,255,255,0.6); 
            font-family: var(--font-display); 
            font-size: 18px; 
        }
        
        .footer-links { display: flex; gap: 24px; flex-wrap: wrap; }
        
        .footer-links a { 
            font-size: 14px; 
            color: rgba(255,255,255,0.7);
            transition: color 0.3s ease;
            text-decoration: none;
        }
        
        .footer-links a:hover { color: var(--accent-gold); }

        .footer-contact { color: rgba(255,255,255,0.7); font-size: 14px; }
        .footer-contact a { 
            color: var(--accent-gold); 
            font-weight: 500; 
            text-decoration: none;
        }
        .footer-contact .separator { color: rgba(255,255,255,0.3); margin: 0 8px; }
        
        .copyright { 
            text-align: center; 
            margin-top: 40px; 
            font-size: 13px; 
            color: rgba(255,255,255,0.5); 
            line-height: 1.8;
        }
        
        .github-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .github-link i {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <img src="/logo.png" alt="ORHAR Logo" class="logo" onerror="this.style.display='none'">
            <h1 id="app-title">ORHAR App</h1>
            <p id="app-message">The app is coming soon. For now, explore our website to learn more about the Mountain of Light.</p>
            <div class="badge" id="app-badge">✦ Coming Soon</div>
            <br>
            <a href="/" class="home-link" id="app-back">← Return to ORHAR</a>
        </div>
    </main>

    <div id="footer-container"></div>

    <script>
        // ========== TRANSLATIONS ==========
        const translations = {
            en: {
                title: 'ORHAR App',
                message: 'The app is coming soon. For now, explore our website to learn more about the Mountain of Light.',
                badge: '✦ Coming Soon',
                back: '← Return to ORHAR'
            },
            fr: {
                title: 'Application ORHAR',
                message: 'L\'application arrive bientôt. En attendant, explorez notre site pour en savoir plus sur la Montagne de Lumière.',
                badge: '✦ Bientôt Disponible',
                back: '← Retour à ORHAR'
            },
            es: {
                title: 'App ORHAR',
                message: 'La aplicación estará disponible pronto. Mientras tanto, explora nuestro sitio para conocer más sobre el Monte de Luz.',
                badge: '✦ Próximamente',
                back: '← Volver a ORHAR'
            },
            de: {
                title: 'ORHAR App',
                message: 'Die App kommt bald. Erkunde vorerst unsere Website, um mehr über den Berg des Lichts zu erfahren.',
                badge: '✦ Demnächst Verfügbar',
                back: '← Zurück zu ORHAR'
            },
            it: {
                title: 'App ORHAR',
                message: 'L\'app arriverà presto. Per ora, esplora il nostro sito per saperne di più sul Monte di Luce.',
                badge: '✦ In Arrivo',
                back: '← Torna a ORHAR'
            },
            pt: {
                title: 'App ORHAR',
                message: 'O aplicativo está chegando. Por enquanto, explore nosso site para saber mais sobre o Monte de Luz.',
                badge: '✦ Em Breve',
                back: '← Voltar para ORHAR'
            },
            pl: {
                title: 'Aplikacja ORHAR',
                message: 'Aplikacja już wkrótce. Tymczasem poznaj naszą stronę, aby dowiedzieć się więcej o Górze Światła.',
                badge: '✦ Wkrótce',
                back: '← Powrót do ORHAR'
            }
        };

        // ========== LANGUAGE DETECTION ==========
        function detectLanguage() {
            const savedLang = localStorage.getItem('orhar_lang');
            const browserLang = navigator.language.slice(0, 2);
            const supported = ['en', 'fr', 'es', 'de', 'it', 'pt', 'pl'];
            
            if (savedLang && supported.includes(savedLang)) return savedLang;
            if (supported.includes(browserLang)) return browserLang;
            return 'en';
        }

        const lang = detectLanguage();
        const t = translations[lang] || translations.en;

        document.getElementById('app-title').textContent = t.title;
        document.getElementById('app-message').textContent = t.message;
        document.getElementById('app-badge').textContent = t.badge;
        document.getElementById('app-back').textContent = t.back;
        document.documentElement.lang = lang;

        // ========== FOOTER LOADER ==========
        fetch('/footer.html')
            .then(response => response.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const footerBlock = doc.getElementById('footer-' + lang) || doc.getElementById('footer-en');
                if (footerBlock) {
                    footerBlock.style.display = '';
                    document.getElementById('footer-container').appendChild(footerBlock);
                }
            })
            .catch(() => console.log('Footer not available'));

        // ========== REDIRECT ==========
        const userAgent = navigator.userAgent || '';
        
        if (/Android/.test(userAgent)) {
            window.location.href = 'https://play.google.com/store/apps/details?id=YOUR_PACKAGE_NAME';
        }
    </script>
</body>
</html>
