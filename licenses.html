            --surface-color: #FFFFFF;
            --primary-navy: #1A2E4A;
            --header-bg: #FCFBF8;
            --accent-gold: #CFB286;
            --accent-brown: #915B27;
            --text-dark: #1e1e1e;
            --text-muted: #4a5568;

            --font-body: 'Work Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); background-color: var(--bg-color); color: var(--text-dark); line-height: 1.7; }
        h1, h2, h3, h4 { font-family: var(--font-display); color: var(--primary-navy); }
        a { text-decoration: none; color: var(--accent-brown); font-weight: 500; }
        a:hover { text-decoration: underline; }

        /* Header & Nav */
        header { padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; background: var(--header-bg); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--accent-gold); }

        .logo-img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
        .logo-text { font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: 2px; color: var(--primary-navy); text-decoration: none !important; }
        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-links a { font-size: 15px; font-weight: 500; color: var(--primary-navy); text-decoration: none; }
        .nav-links a:hover { color: var(--accent-brown); text-decoration: none; }

        .lang-select { background: transparent; border: 1px solid var(--accent-gold); color: var(--primary-navy); padding: 5px 10px; border-radius: 6px; font-family: var(--font-body); font-weight: 500; cursor: pointer; outline: none; }

        .legal-wrapper { max-width: 800px; margin: 60px auto; padding: 0 5%; }
        .legal-wrapper h1 { font-size: 42px; margin-bottom: 10px; text-align: center; }
        .eff-date { text-align: center; color: var(--text-muted); margin-bottom: 50px; font-style: italic; }
        
        .highlight-box { background-color: rgba(207, 178, 134, 0.1); border-left: 4px solid var(--accent-gold); padding: 25px; border-radius: 0 12px 12px 0; margin-bottom: 40px;}
        .highlight-box h3 { margin-bottom: 10px; color: var(--accent-brown); font-size: 24px;}
        
        .category-header { margin-top: 40px; margin-bottom: 20px; border-bottom: 1px solid rgba(207, 178, 134, 0.3); padding-bottom: 10px; font-size: 28px; }
        
        .license-box { background: var(--surface-color); padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); margin-bottom: 20px; border-top: 3px solid var(--primary-navy); }
        .license-name { font-size: 20px; font-weight: 600; color: var(--primary-navy); margin-bottom: 5px; font-family: var(--font-display); }
        .license-type { font-size: 14px; color: var(--accent-brown); font-style: italic; margin-bottom: 15px; }
        .license-description { font-size: 15px; color: var(--text-muted); margin-bottom: 15px; }
        .license-details { font-size: 14px; color: var(--text-dark); }
        .license-details strong { font-weight: 600; }
        
        pre { background-color: #f5f5f5; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 13px; font-family: monospace; border: 1px solid #ddd; margin-top: 15px; color: #333;}
        details summary { cursor: pointer; color: var(--accent-brown); font-weight: 600; font-size: 15px; }

        footer { background-color: var(--surface-color); padding: 60px 5% 30px; border-top: 1px solid var(--accent-gold); margin-top: 60px; }
        .footer-content { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 30px; }
        .footer-brand h2 { font-size: 32px; letter-spacing: 3px; margin-bottom: 5px; }
        .footer-brand p { font-style: italic; color: var(--text-muted); font-family: var(--font-display); font-size: 18px; }
        .footer-links { display: flex; gap: 20px; }
        .footer-links a { font-size: 14px; color: var(--text-muted); text-decoration: none; }
        .footer-links a:hover { color: var(--accent-brown); }
        .copyright { text-align: center; margin-top: 40px; font-size: 13px; color: var(--text-muted); opacity: 0.8; }

            .legal-wrapper h1 { font-size: 32px; }
            .nav-links { flex-wrap: wrap; justify-content: center; margin-top: 15px; }
            header { flex-direction: column; }
            .footer-content { flex-direction: column; text-align: center; }

        function changeLang(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (legalData[lang] && legalData[lang][key]) {
                    el.innerHTML = legalData[lang][key];
                }
            });
            
            const contentDiv = document.getElementById('legal-content');
            if (legalData[lang] && legalData[lang].html) {
                contentDiv.innerHTML = legalData[lang].html;
            }

            localStorage.setItem('orhar_lang', lang);
            document.documentElement.lang = lang;
        }

        document.addEventListener("DOMContentLoaded", () => {
            const savedLang = localStorage.getItem('orhar_lang');
            const browserLang = navigator.language.slice(0, 2);
            const supported = ['en', 'fr', 'es', 'de', 'it', 'pt', 'pl'];
            
            let initLang = 'en'; 
            if (savedLang && supported.includes(savedLang)) {
                initLang = savedLang;
            } else if (supported.includes(browserLang)) {
                initLang = browserLang;
            }
            
            document.getElementById('langSwitch').value = initLang;
            changeLang(initLang);
        });
    </script>
