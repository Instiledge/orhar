name: Auto-Update Sitemap Date

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 1 * *'  # Runs on the 1st of every month

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Update lastmod date in sitemap.xml
        run: |
          TODAY=$(date +%Y-%m-%d)
          sed -i "s/<lastmod>[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}<\/lastmod>/<lastmod>${TODAY}<\/lastmod>/g" sitemap.xml

      - name: Commit updated sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --quiet || git commit -m "Auto-update sitemap dates [skip ci]"
          git push
