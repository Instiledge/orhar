name: Auto-Update Sitemap Date

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write

concurrency:
  group: auto-sitemap
  cancel-in-progress: true

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update lastmod date in sitemap.xml
        shell: bash
        run: |
          set -euo pipefail

          TODAY="$(date -u +%Y-%m-%d)"

          if [ ! -f sitemap.xml ]; then
            echo "sitemap.xml not found"
            exit 1
          fi

          sed -i -E "s|<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>|<lastmod>${TODAY}</lastmod>|g" sitemap.xml

      - name: Commit updated sitemap
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- sitemap.xml; then
            echo "No sitemap changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml
          git commit -m "Auto-update sitemap dates [skip ci]"
          git push
